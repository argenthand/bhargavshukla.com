# Builds the Strapi image (#11). Pull requests only build; main also pushes to GHCR.
# Deploy is manual: see docs/infrastructure.md → Runbook.
name: CMS image

on:
  push:
    branches: [main]
    paths: ['cms/**', '.github/workflows/cms-image.yml']
  pull_request:
    paths: ['cms/**', '.github/workflows/cms-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cms-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/argenthand/bhargavshukla-cms

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: cms
          # CX23 is x86; add linux/arm64 if the VPS ever moves to ARM (CAX).
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
