# Builds the Strapi image (#11). Pull requests only build; main also pushes to GHCR and then
# deploys that exact commit to the VPS (#48). See docs/infrastructure.md → Automated CMS deploys.
name: CMS image

on:
  push:
    branches: [main]
    paths: ['cms/**', '.github/workflows/cms-image.yml']
  pull_request:
    paths: ['cms/**', '.github/workflows/cms-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cms-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/argenthand/bhargavshukla-cms

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: cms
          # CX23 is x86; add linux/arm64 if the VPS ever moves to ARM (CAX).
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Deploy history under the repo's Environments; an approval rule can be added there later.
    environment: production
    # One deploy at a time, and never cancel one halfway.
    concurrency:
      group: cms-deploy
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_KEY: ${{ secrets.CMS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.CMS_KNOWN_HOSTS }}
          HOST: ${{ secrets.CMS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key can only run /opt/cms/deploy.sh; the SHA reaches it as SSH_ORIGINAL_COMMAND.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "deploy@$HOST" "$GITHUB_SHA"
