<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before the first paint. `js` turns on the js: variant. The server hooks put the look's
			// script in the comment below: the saved theme, palette and 8-bit mode (src/lib/look-boot.ts).
			document.documentElement.classList.add('js');
			/*%look%*/
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-page text-ink antialiased print:bg-white print:text-black"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
